<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<aside id="sidebar"></aside>

<nav id="dz-strip"></nav>

<main>
  <div class="wf-screen">
    <nav class="wf-appbar" id="wf-appbar" aria-label="Brio">
      <div class="wf-appbar-inner">
        <span class="wf-brand">Brio</span>
        <span class="sp"></span>
        <span class="wf-step">Your answers are anonymous</span>
      </div>
    </nav>

    <div class="wf-content">
      <div class="wf-narrow">
        <p class="wf-eyebrow" aria-live="polite">Question 1 of 1</p>
        <h1 id="q1-label">How has work felt this week?</h1>

        <form>
          <fieldset aria-labelledby="q1-label">
            <label class="wf-radio"><input type="radio" name="q1" value="rough"> Rough</label>
            <label class="wf-radio"><input type="radio" name="q1" value="okay"> Okay</label>
            <label class="wf-radio"><input type="radio" name="q1" value="good"> Good</label>
          </fieldset>
          <a class="wf-btn solid block" href="checkin-questions-loading.html">Send answers</a>
        </form>

        <p class="wf-strip2">Your answer joins a team aggregate. A score is shown only after at least 5 people answer, and there is no live count.</p>
      </div>
    </div>
  </div>
</main>
